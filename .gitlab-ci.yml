# CI/CD for the local GitLab instance (http://gitlab.local:8929/).
#
# Prerequisites on the GitLab side (not configurable from this file):
#   - the runner uses the docker executor and is registered with
#     privileged = true (needed for the docker-in-docker service below)
#   - the project's Container Registry is enabled, otherwise the
#     build job fails on an empty $CI_REGISTRY
#   - if the runner is registered with specific tags, mirror them on the jobs

stages:
  - lint
  - test
  - build

# One pipeline per change: an MR pipeline when a merge request is open,
# otherwise a plain branch pipeline (no duplicates).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null

variables:
  # The app reads DB_* at import time and CI has no .env; the integration
  # suite uses its own testcontainers MySQL, so these are placeholders only.
  DB_HOST: 127.0.0.1
  DB_PORT: "3306"
  DB_NAME: ci
  DB_USER: ci
  DB_PASSWORD: ci
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache

.uv_job:
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache

.dind:
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client

lint:
  stage: lint
  extends: .uv_job
  script:
    - uv sync --locked
    - uv run ruff check .
    - uv run ruff format --check .

test:
  stage: test
  extends:
    - .uv_job
    - .dind
  script:
    - echo "DOCKER_CERT_PATH=$DOCKER_CERT_PATH"
    - ls -la "$DOCKER_CERT_PATH"
    - uv sync --locked
    - uv run pytest

build:
  stage: build
  image: docker:27
  extends: .dind
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    # Also tag :latest when building from the default branch
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
