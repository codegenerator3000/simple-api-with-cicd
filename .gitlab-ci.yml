# CI/CD for the local GitLab instance (http://gitlab.local:8929/).
#
# Prerequisites on the GitLab side (not configurable from this file):
#   - the runner uses the docker executor and is registered with
#     privileged = true (needed for the docker-in-docker service below)
#   - if the runner is registered with specific tags, mirror them on the jobs

stages:
  - lint
  - test
  - deploy

# One pipeline per change: an MR pipeline when a merge request is open,
# otherwise a plain branch pipeline (no duplicates).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null

variables:
  # The app reads DB_* at import time and CI has no .env; the integration
  # suite uses its own testcontainers MySQL, so these are placeholders only.
  DB_HOST: 127.0.0.1
  DB_PORT: "3306"
  DB_NAME: ci
  DB_USER: ci
  DB_PASSWORD: ci
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache

.uv_job:
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache

.dind:
  services:
    - name: docker:29.9.1-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2376"
  
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client

lint:
  stage: lint
  extends: .uv_job
  script:
    - uv sync --locked
    - uv run ruff check .
    - uv run ruff format --check .

test:
  stage: test
  extends:
    - .uv_job
    - .dind
  script:
    - uv sync --locked
    - uv run pytest

deploy:
  stage: deploy
  image: docker:29.9.1-cli
  tags:
    - deploy
    - shell
  environment: production
  script:
    - docker compose -f prod.compose.yaml up -d --build
